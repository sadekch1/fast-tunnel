name: Cloudflare SSH Server

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'SSH Password'
        required: true
        default: 'sadek12345'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Server
        run: |
          echo "root:${{ github.event.inputs.password }}" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "SSH Server is ready and running!"

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflare-tunnel/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Tunnel
        run: |
          echo "=================================================="
          echo "Username: root"
          echo "Password: ${{ github.event.inputs.password }}"
          echo "=================================================="
          cloudflared tunnel --url tcp://localhost:22
