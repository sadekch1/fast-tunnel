name: Fast SSH Server

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'SSH Password'
        required: true
        default: 'sadek12345'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Server
        run: |
          echo "root:${{ github.event.inputs.password }}" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "SSH Server is ready and running!"

      - name: Install Bore (Fast TCP Tunnel)
        run: |
          curl -sSfL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin

      - name: Start Tunnel and Show Connection Details
        run: |
          echo "=================================================="
          echo "Username: root"
          echo "Password: ${{ github.event.inputs.password }}"
          echo "=================================================="
          echo "Look for the listening port on bore.pub below:"
          echo "=================================================="
          bore local 22 --to bore.pub
